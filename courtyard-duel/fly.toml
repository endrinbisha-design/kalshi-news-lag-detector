# Fly.io: `fly launch --no-deploy --copy-config` then `fly deploy`. Fly terminates TLS and proxies WebSockets.
# Keep a single machine: rooms are held in memory.
app = "courtyard-duel"          # change to a unique name
primary_region = "fra"          # pick a region close to you and your friend

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  TRUST_PROXY = "1"
  HSTS = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"     # a sleeping machine would drop live matches
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "connections"
    hard_limit = 200
    soft_limit = 150

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/healthz"
  timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
